<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docucore — Document Management</title>
    <meta name="description" content="Docucore: a secure, versioned document management service. Upload, version, share and search documents." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <p class="boot">Loading Docucore… <span class="muted small">(on the free tier the server can take up to a minute to wake up)</span></p>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript>Docucore's web interface needs JavaScript. The REST API is documented at <a href="/api-docs">/api-docs</a>.</noscript>
    <script src="/app.js" defer></script>
  </body>
</html>
