# Optional keep-alive. Free hosts sleep after ~15 minutes idle, and Atlas free clusters pause after
# 30 days without activity; a periodic GET /health (which also pings MongoDB) prevents both.
#
# Setup: repo Settings > Secrets and variables > Actions > Variables > New variable
#        APP_URL = https://your-service.onrender.com
#
# Caveat: GitHub disables scheduled workflows after 60 days without repository activity, and cron
# timing is best-effort. An external monitor (UptimeRobot, free) is the more reliable primary option;
# see docs/DEPLOYMENT.md. Keeping both is fine.
name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${{ vars.APP_URL }}/health"
