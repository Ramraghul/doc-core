name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # mongodb-memory-server downloads a mongod binary on first run; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Test-case matrix is up to date
        run: |
          npm run docs:tests
          git diff --exit-code docs/TEST_CASES.md || (echo "docs/TEST_CASES.md is stale: run 'npm run docs:tests' and commit" && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t docucore:ci .
